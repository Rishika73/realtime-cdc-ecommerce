name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m compileall airflow spark

      - name: Validate Debezium connector configuration
        run: |
          python -m json.tool debezium/postgres-connector.json > /dev/null

      - name: Validate Docker Compose configuration
        run: |
          docker compose config
